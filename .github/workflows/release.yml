name: Build & Release

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || 'release' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Version scheme: semantic version, tag "vX.Y.Z". baseVersionName in app/build.gradle.kts holds X.Y: a change with a
# new feature raises Y there, a big change raises X. Z counts the releases of X.Y from 0, so a fix needs no edit.
# versionCode = X * 10000000 + Y * 10000 + Z, above the earlier "v1.0.<run>" releases (versionCode = run); the in-app
# updater reads tags the same way (AppUpdater.versionCodeOf).
env:
  PUBLISH: ${{ github.event_name != 'pull_request' }}

jobs:
  # Runs with a read-only token. Signing secrets are only exposed to publishing runs;
  # pull request check builds use the debug key.
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # tags, for the next version number
          persist-credentials: false

      # Read by app/build.gradle.kts. A re-run of a released commit keeps its version.
      - name: Compute version
        id: version
        run: |
          set -euo pipefail
          existing=$(git tag --points-at "$GITHUB_SHA" --list 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1 || true)
          series=$(sed -nE 's/^val baseVersionName = "([0-9]+\.[0-9]+)"$/\1/p' app/build.gradle.kts)
          if [ -z "$series" ]; then
            echo "::error::app/build.gradle.kts must have val baseVersionName = \"MAJOR.MINOR\""
            exit 1
          fi
          if [ "$PUBLISH" = "true" ] && [ -n "$existing" ] && [[ "$existing" == "v$series."* ]]; then
            version=${existing#v}
          else
            last=$(git tag --list "v${series}.*" | sed "s/^v${series}\.//" | grep -E '^[0-9]+$' | sort -n | tail -n 1 || true)
            if [ -n "$last" ]; then patch=$(( last + 1 )); else patch=0; fi
            version="$series.$patch"
            # A lower X.Y would publish a release older than the latest one
            newest=$(git tag --list 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1 || true)
            if [ -n "$newest" ] && [ "$(printf '%s\n' "$newest" "v$version" | sort -V | tail -n 1)" != "v$version" ]; then
              echo "::error::v$version would be older than $newest, raise baseVersionName"
              exit 1
            fi
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "VERSION_NAME=$version" >> "$GITHUB_ENV"
          echo "Version v$version"

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Decode signing keystore
        if: env.PUBLISH == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 secret is missing; refusing to publish a debug-signed APK."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build release APK
        if: env.PUBLISH == 'true'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew --no-daemon --stacktrace :app:assembleRelease

      - name: Build check APK (debug-signed)
        if: env.PUBLISH != 'true'
        run: ./gradlew --no-daemon --stacktrace :app:assembleRelease

      - name: Verify signature
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs "$APK"
          mkdir -p dist
          cp "$APK" "dist/PortraitGuard-v$VERSION_NAME.apk"

      - uses: actions/upload-artifact@v7
        with:
          name: PortraitGuard-v${{ env.VERSION_NAME }}
          path: dist/*.apk
          if-no-files-found: error

  # Only this job gets a write token, and it never runs pull request code.
  publish:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION_NAME: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/download-artifact@v7
        with:
          name: PortraitGuard-v${{ env.VERSION_NAME }}
          path: dist

      # Notes are Chinese first, then English: commit / PR titles are written as "中文 / English".
      - name: Write release notes
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)
          {
            IFS=. read -r X Y Z <<< "$VERSION_NAME"
            echo "versionCode: $(( X * 10000000 + Y * 10000 + Z ))"
            echo
            if [ -n "$PREV_TAG" ]; then
              echo "### 自 $PREV_TAG 以来的更新 / Changes since $PREV_TAG"
              RANGE="$PREV_TAG..HEAD"
            else
              echo "### 更新内容 / What's changed"
              RANGE="HEAD"
            fi
            echo
            COMMITS=$(git log --no-merges --format='- %s (%h)' $RANGE)
            echo "${COMMITS:-- 无新提交（重新构建）/ No new commits (rebuild)}"
          } > notes.md
          cat notes.md

      # The app reads this from /releases/latest/download/update.json: release downloads have no request
      # limit, unlike api.github.com (60 requests an hour per IP without login, often used up on mobile networks).
      - name: Write update manifest
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # A rerun of a published version keeps its notes: with its tag already there, notes.md lists no commits.
          if gh release view "v$VERSION_NAME" > /dev/null 2>&1; then
            gh release view "v$VERSION_NAME" --json body --jq .body > notes.md
          fi
          APK=$(ls dist/*.apk | head -n 1)
          jq -n \
            --arg tag "v$VERSION_NAME" \
            --rawfile notes notes.md \
            --arg name "$(basename "$APK")" \
            --argjson size "$(stat -c %s "$APK")" \
            --arg sha256 "$(sha256sum "$APK" | cut -d ' ' -f 1)" \
            '{tag_name: $tag, body: $notes, apk: {name: $name, size: $size, sha256: $sha256}}' > dist/update.json
          cat dist/update.json

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG="v$VERSION_NAME"
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/*.apk dist/update.json --clobber
            exit 0
          fi
          # A re-run of an older build must not take the "latest" pointer from a newer release,
          # because the app's update check reads /releases/latest.
          HIGHEST=$(git tag --list 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1)
          LATEST=--latest
          if [ -n "$HIGHEST" ] && [ "$(printf '%s\n' "$HIGHEST" "$TAG" | sort -V | tail -n 1)" != "$TAG" ]; then
            LATEST=--latest=false
          fi
          gh release create "$TAG" dist/*.apk dist/update.json \
            --title "竖屏守护 $TAG" \
            --notes-file notes.md \
            --target "$GITHUB_SHA" \
            "$LATEST"
