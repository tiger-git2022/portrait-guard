name: Build & Release

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || 'release' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VERSION_NAME: 1.0.${{ github.run_number }}
      PUBLISH: ${{ github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            if [ "$PUBLISH" = "true" ]; then
              echo "::error::KEYSTORE_BASE64 secret is missing; refusing to publish a debug-signed APK."
              exit 1
            fi
            echo "::warning::No signing secrets available; this check build uses the debug key."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew --no-daemon --stacktrace :app:assembleRelease

      - name: Verify signature
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs "$APK"
          mkdir -p dist
          cp "$APK" "dist/PortraitGuard-v$VERSION_NAME.apk"

      - uses: actions/upload-artifact@v7
        if: env.PUBLISH != 'true'
        with:
          name: PortraitGuard-v${{ env.VERSION_NAME }}
          path: dist/*.apk

      - name: Write release notes
        if: env.PUBLISH == 'true'
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)
          {
            echo "versionCode: ${{ github.run_number }}"
            echo
            if [ -n "$PREV_TAG" ]; then
              echo "### 自 $PREV_TAG 以来的更新"
              RANGE="$PREV_TAG..HEAD"
            else
              echo "### 更新内容"
              RANGE="HEAD"
            fi
            echo
            COMMITS=$(git log --no-merges --format='- %s (%h)' $RANGE)
            echo "${COMMITS:-- 无新提交（重新构建）}"
          } > dist/notes.md
          cat dist/notes.md

      - name: Publish GitHub release
        if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$VERSION_NAME"
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/*.apk --clobber
          else
            gh release create "$TAG" dist/*.apk \
              --title "竖屏守护 $TAG" \
              --notes-file dist/notes.md \
              --target "$GITHUB_SHA" \
              --latest
          fi
